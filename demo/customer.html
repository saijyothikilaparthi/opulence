<!DOCTYPE html>
<html>
<head>

    <title>Gift Website</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .banner {
            width: 100%;
            height: 400px;
            overflow: hidden;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            text-align: center;
            padding: 40px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        #error {
            color: red;
        }

    </style>

</head>


<body>


    <div class="banner">

        <img
            id="bannerImage"
            src=""
            alt="Gift Banner"
        >

    </div>


    <div class="content">

        <h1 id="bannerTitle">
            Loading...
        </h1>

        <p>
            Customized gifts for every occasion.
        </p>

        <button>
            Enquire Now
        </button>

        <p id="error"></p>

    </div>


    <script>

        async function loadBanner() {

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/api/banners/active"
                );

                const result = await response.json();


                if (
                    result.success &&
                    result.data
                ) {

                    const banner = Array.isArray(result.data) ? result.data[0] : result.data;

                    if (banner) {
                        document.getElementById(
                            "bannerTitle"
                        ).innerText = banner.event || banner.title || "Customized Gifts & Hampers";


                        document.getElementById(
                            "bannerImage"
                        ).src =
                            "http://127.0.0.1:8000"
                            + banner.image_url;
                    }

                }

            } catch (error) {

                document.getElementById(
                    "error"
                ).innerText =
                    "Unable to load banner.";

            }

        }


        loadBanner();

    </script>


</body>
</html>
